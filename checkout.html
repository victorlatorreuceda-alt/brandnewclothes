<!doctype html>
<html lang="es">
<head>
  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({'gtm.start': new Date().getTime(),event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-M4LBPDSQ');
  </script>
  <!-- End GTM -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checkout</title>
</head>

<body style="font-family:Arial; max-width:900px; margin:40px auto; padding:0 16px;">

  <!-- GTM noscript -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M4LBPDSQ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <div style="background:#eff6ff; border:1px solid #93c5fd; border-radius:10px; padding:12px; margin-bottom:18px;">
    <strong>Funnel:</strong> pricing → checkout → success
    <div style="margin-top:8px;">
      <a href="pricing.html" style="display:inline-block; margin-right:8px; padding:6px 10px; border:1px solid #2563eb; border-radius:6px; text-decoration:none;">← Volver a pricing</a>
      <a href="index.html" style="display:inline-block; padding:6px 10px; border:1px solid #2563eb; border-radius:6px; text-decoration:none;">Ir a home</a>
    </div>
  </div>

  <h1>Complete your plan</h1>

  <div style="display:flex; gap:40px; flex-wrap:wrap;">

    <div style="flex:1; min-width:280px; border:1px solid #ddd; border-radius:12px; padding:16px;">
      <h3>Billing details</h3>

      <input placeholder="Your name" style="width:100%; margin-bottom:10px;" />
      <input placeholder="you@example.com" style="width:100%; margin-bottom:10px;" />
      <input placeholder="4242 4242 4242 4242" style="width:100%; margin-bottom:20px;" />

      <button id="begin_checkout_btn">Begin checkout</button>
      <button id="purchase_btn">Complete purchase</button>
      <p id="purchase_feedback" style="margin-top:12px; color:#1d4ed8; font-weight:600;"></p>
    </div>

    <div style="flex:1; min-width:280px; border:1px solid #ddd; border-radius:12px; padding:16px;">
      <h3>Order summary</h3>
      <p>Selected plan: <strong id="plan_name"></strong></p>
      <p>Price: €<span id="price"></span></p>
    </div>

  </div>

  <script>
    window.dataLayer = window.dataLayer || [];

    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || 'unknown';
    const value = params.get('value') || '0';

    const planNode = document.getElementById('plan_name');
    const priceNode = document.getElementById('price');
    const beginBtn = document.getElementById('begin_checkout_btn');
    const purchaseBtn = document.getElementById('purchase_btn');
    const purchaseFeedback = document.getElementById('purchase_feedback');

    if (planNode) planNode.textContent = plan;
    if (priceNode) priceNode.textContent = value;

    if (beginBtn) {
      beginBtn.addEventListener('click', function () {
        window.dataLayer.push({
          event: 'begin_checkout',
          plan_type: plan,
          value: value,
          currency: 'EUR'
        });
      });
    }

    if (purchaseBtn) {
      purchaseBtn.addEventListener('click', function () {
        purchaseBtn.disabled = true;
        purchaseBtn.textContent = 'Processing...';
        if (purchaseFeedback) {
          purchaseFeedback.textContent = 'Processing your purchase...';
        }

        window.dataLayer.push({
          event: 'purchase',
          plan_type: plan,
          value: value,
          currency: 'EUR',
          transaction_id: Date.now().toString()
        });

        setTimeout(function () {
          window.location.href = 'success.html?plan=' + encodeURIComponent(plan) + '&value=' + encodeURIComponent(value);
        }, 700);
      });
    }
  </script>

</body>
</html>
