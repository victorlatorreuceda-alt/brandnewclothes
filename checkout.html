<script>
  window.dataLayer = window.dataLayer || [];

  const params = new URLSearchParams(window.location.search);
  const plan = params.get('plan') || 'unknown';
  const value = params.get('value') || '0';

  document.getElementById('plan_name').textContent = plan;
  document.getElementById('price').textContent = value;

  const beginBtn = document.getElementById('begin_checkout_btn');
  const purchaseBtn = document.getElementById('purchase_btn');

  beginBtn.addEventListener('click', function () {
    window.dataLayer.push({
      event: 'begin_checkout',
      plan_type: plan,
      value: value
    });
    console.log('begin_checkout enviado', { plan_type: plan, value: value });
  });

  purchaseBtn.addEventListener('click', function () {
    window.dataLayer.push({
      event: 'purchase',
      plan_type: plan,
      value: value,
      transaction_id: Date.now().toString()
    });
    console.log('purchase enviado', { plan_type: plan, value: value });
  });
</script>
