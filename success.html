<!doctype html>
<html lang="es">
<head>
  <!-- Google Tag Manager -->
  <script>

          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compra completada - HabitFlow</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
      color: #111827;
    }

    nav a {
      margin-left: 16px;
      text-decoration: none;
      color: #374151;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }

    .badge {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .summary {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
      text-align: left;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #2563eb;
      background: #ffffff;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
  </style>
</head>

<body>
  <!-- GTM noscript -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M4LBPDSQ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <header>
    <div class="topbar">
      <a class="brand" href="index.html">HabitFlow</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="pricing.html">Pricing</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="badge">Payment confirmed</div>

      <h1>Compra completada</h1>
      <p>Tu suscripción está activa y ya puedes continuar con HabitFlow.</p>

      <div class="summary">
        <p><strong>Plan seleccionado:</strong> <span id="plan">-</span></p>
        <p><strong>Precio:</strong> €<span id="price">0</span> / month</p>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="index.html">Volver a home</a>
        <a class="btn" href="pricing.html">Ver pricing</a>
        <a class="btn" href="dashboard.html">Ir al dashboard</a>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || 'unknown';
    const value = params.get('value') || '0';

    document.getElementById('plan').textContent = plan;
    document.getElementById('price').textContent = value;
  </script>
</body>
</html>
